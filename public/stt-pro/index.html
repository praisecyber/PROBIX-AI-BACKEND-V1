<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STT Pro - Offline Speech-to-Text</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background-color: #0d1117;
      color: #c9d1d9;
      font-family: 'Consolas', 'Courier New', monospace;
      padding: 20px;
      max-width: 1000px;
      margin: 0 auto;
    }
    header {
      border-bottom: 1px solid #30363d;
      padding-bottom: 20px;
      margin-bottom: 20px;
    }
    header h1 {
      color: #58a6ff;
      font-size: 2rem;
      margin-bottom: 8px;
    }
    #status {
      font-size: 1.1rem;
      margin-bottom: 10px;
    }
    #pipeline {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .stage {
      background-color: #161b22;
      padding: 8px 16px;
      border-radius: 6px;
      border: 1px solid #30363d;
      font-size: 0.9rem;
      transition: all 0.3s ease;
    }
    .stage.active {
      border-color: #f0883e;
      color: #f0883e;
      box-shadow: 0 0 8px rgba(240, 136, 62, 0.4);
    }
    .stage.complete {
      border-color: #238636;
      color: #238636;
    }
    canvas {
      width: 100%;
      height: 100px;
      background-color: #010409;
      border: 1px solid #30363d;
      border-radius: 6px;
      margin-bottom: 20px;
    }
    #partialText {
      min-height: 60px;
      color: #f0883e;
      font-size: 1.1rem;
      margin-bottom: 20px;
      border: 1px dashed #30363d;
      padding: 12px;
      border-radius: 6px;
    }
    #finalText {
      min-height: 120px;
      font-size: 1.5rem;
      margin-bottom: 20px;
      border: 1px solid #30363d;
      padding: 16px;
      border-radius: 6px;
      background-color: #010409;
    }
    #latency {
      color: #58a6ff;
      margin-bottom: 20px;
    }
    button {
      font-family: inherit;
      padding: 12px 24px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-size: 1rem;
      margin-right: 10px;
      transition: all 0.2s ease;
    }
    #recordBtn {
      background-color: #238636;
      color: white;
    }
    #recordBtn.recording {
      background-color: #f85149;
      animation: pulse 1s infinite;
    }
    #clearBtn {
      background-color: #161b22;
      color: #c9d1d9;
      border: 1px solid #30363d;
    }
    #clearBtn:hover {
      background-color: #21262d;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    #history {
      margin-top: 30px;
      border-top: 1px solid #30363d;
      padding-top: 20px;
    }
    #history h3 {
      margin-bottom: 12px;
      color: #8b949e;
    }
    .historyItem {
      background-color: #010409;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 12px;
      margin-bottom: 10px;
    }
    .historyTimestamp {
      font-size: 0.8rem;
      color: #8b949e;
      margin-bottom: 6px;
    }
  </style>
</head>
<body>
  <header>
    <h1>STT Pro</h1>
    <div id="status">Status: <span id="statusText">Connecting...</span></div>
    <div id="pipeline">
      <div class="stage" id="stage-vad">VAD</div>
      <div class="stage" id="stage-ffmpeg">FFMPEG</div>
      <div class="stage" id="stage-vosk">VOSK</div>
      <div class="stage" id="stage-whisper">WHISPER</div>
      <div class="stage" id="stage-mistral">MISTRAL</div>
      <div class="stage" id="stage-output">OUTPUT</div>
    </div>
  </header>

  <canvas id="waveform"></canvas>

  <div id="partialText">Partial text will appear here...</div>
  <div id="finalText">Final text will appear here...</div>
  <div id="latency"></div>

  <button id="recordBtn">RECORD</button>
  <button id="clearBtn">CLEAR</button>

  <div id="history">
    <h3>Transcript History (Last 10)</h3>
    <div id="historyList"></div>
  </div>

  <script src="js/client.js"></script>
</body>
</html>
